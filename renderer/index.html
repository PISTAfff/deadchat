<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file: data: blob:; media-src 'self' file: blob:; font-src 'self'; connect-src 'none'; worker-src 'self'; form-action 'none'">
  <title>DeadChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="side-head">
        <div class="brand"><img src="mark.svg" alt=""><span class="wordmark"><span class="dead">dead</span>chat</span></div>
        <button id="btn-import" class="icon-btn" title="Import a WhatsApp export">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16" /></svg>
        </button>
      </header>
      <div id="side-list" class="side-list"></div>
    </aside>

    <main id="main">
      <div id="empty" class="empty">
        <div class="empty-inner">
          <img class="empty-logo" src="mark.svg" alt="">
          <span class="wordmark"><span class="dead">dead</span>chat</span>
          <div class="tagline">Never delivered.<span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span></div>
          <p class="muted">A quiet place for conversations that ended. Scroll back, listen again, write what you never sent. Nothing leaves this computer.</p>
          <button id="btn-import-empty" class="primary">Import an export</button>
        </div>
      </div>

      <section id="chat-view" hidden>
        <header class="chat-head">
          <button class="icon-btn back-btn" id="chat-back" title="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-6l-6 6 6 6" /></svg></button>
          <div class="avatar" id="chat-avatar"></div>
          <div class="chat-titles">
            <div class="chat-title" id="chat-title"></div>
            <div class="chat-sub" id="chat-sub"></div>
          </div>
          <div class="chat-actions">
            <input type="date" id="jump-date" title="Jump to a date">
            <button class="icon-btn" id="btn-search" title="Search (Ctrl+F)">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
            </button>
            <button class="icon-btn" id="btn-menu" title="Chat options">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="12" cy="19" r="1.4" /></svg>
            </button>
          </div>
          <div class="menu" id="chat-menu" hidden>
            <button data-act="add">Add another export to this chat</button>
            <button data-act="export">Export chat…</button>
            <button data-act="me">Switch which side is me</button>
            <button data-act="avatar">Set profile photo…</button>
            <button data-act="rename">Rename</button>
            <button data-act="date" class="mobile-only">Go to a date…</button>
            <button data-act="first">Go to the first message</button>
            <button data-act="remove" class="danger">Remove from DeadChat</button>
          </div>
        </header>
        <div class="searchbar" id="searchbar" hidden>
          <input type="search" id="search-input" placeholder="Search this chat" dir="auto">
          <span id="search-count" class="muted"></span>
          <button class="icon-btn" id="search-prev" title="Previous (Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></svg></button>
          <button class="icon-btn" id="search-next" title="Next (Enter)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg></button>
          <button class="icon-btn" id="search-close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
        </div>
        <div id="messages" class="messages" tabindex="0"></div>
        <button id="to-bottom" class="to-bottom" hidden title="Jump to the latest message">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <footer class="composer">
          <div class="emoji-panel" id="emoji-panel" hidden>
            <div class="ep-tabs"><button class="on" data-tab="emoji">Emoji</button><button data-tab="stickers">Stickers</button></div>
            <div class="ep-body" id="ep-body"></div>
          </div>
          <div class="c-bar">
            <button class="c-btn" id="emoji-btn" title="Emoji">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M8.5 14.5c.9 1.3 2.1 2 3.5 2s2.6-.7 3.5-2" /><circle cx="9" cy="10" r=".6" /><circle cx="15" cy="10" r=".6" /></svg>
            </button>
            <textarea id="compose" rows="1" dir="auto" placeholder="Type a message"></textarea>
            <button class="c-btn" id="attach-btn" title="Attach photos, videos or files">
              <svg viewBox="0 0 24 24"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.3-8.3a3.3 3.3 0 0 1 4.7 4.7l-8.3 8.3a1.7 1.7 0 0 1-2.4-2.4l7.6-7.6" /></svg>
            </button>
          </div>
          <div class="rec-bar" id="rec-bar" hidden>
            <button class="c-btn rec-cancel" id="rec-cancel" title="Discard"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" /></svg></button>
            <span class="rec-dot"></span><span class="rec-time" id="rec-time">0:00</span>
            <span class="rec-hint">Recording · it stays here, never delivered</span>
          </div>
          <button class="send" id="send" title="Record a voice note">
            <svg class="i-send" viewBox="0 0 24 24"><path d="M3.4 20.4l17.4-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.2 1L4 11l9 1-9 1-1.8 6.4c-.2.7.5 1.3 1.2 1z" /></svg>
            <svg class="i-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z" /></svg>
          </button>
        </footer>
      </section>

      <aside id="info-panel" class="info-panel" hidden>
        <header class="info-head">
          <button class="icon-btn" id="info-close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
          <span>Contact info</span>
        </header>
        <div class="info-body" id="info-body"></div>
      </aside>

    </main>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-bar">
      <div class="lb-who"><div class="avatar" id="lb-avatar"></div><div><div class="lb-name" id="lb-name"></div><div class="lb-sub" id="lb-sub"></div></div></div>
      <div class="lb-actions">
      <button class="icon-btn" id="lb-goto" title="Go to message"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" /><path d="M9 10h6m-3-3v6" /></svg></button>
      <button class="icon-btn" id="lb-close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      </div>
    </div>
    <div class="lb-stage">
      <button class="lb-nav prev" id="lb-prev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
      <img id="lightbox-img" alt="">
      <video id="lightbox-video" controls hidden></video>
      <button class="lb-nav next" id="lb-next" title="Next (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
    </div>
    <div class="lb-caption" id="lb-caption" dir="auto"></div>
    <div class="lb-strip" id="lb-strip"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="shared/parser.js"></script>
  <script src="shared/core.js"></script>
  <script src="vendor/fflate.js"></script>
  <script src="web-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
