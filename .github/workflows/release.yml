name: Release

# Push a tag like v1.0.0 (or run it by hand) to build DeadChat for Windows, macOS and Linux
# and publish them together as one GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A draft release first, so every build uploads into the same one.
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.make.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "DeadChat $tag" --notes-file .github/release-notes.md --target "$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-22.04
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Ad-hoc sign the macOS app
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d dist/mac-universal/*.app)
          codesign --force --deep -s - "$app"
          rm -f dist/*.dmg
          npx electron-builder --mac --universal --prepackaged "$app" --publish never

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb)
          gh release upload "${{ needs.draft.outputs.tag }}" "${files[@]}" --clobber

  android:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run android

      # Signs with the project's release key when the repo has it as secrets; otherwise with a
      # throwaway debug key (installable, but it can't update an APK signed with the release key).
      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          DEADCHAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DEADCHAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DEADCHAT_KEY_ALIAS: deadchat
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export DEADCHAT_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          v=$(node -p "require('../package.json').version")
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/DeadChat-$v-android.apk"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, so this APK is debug-signed and is not attached to the release."
            exit 0
          fi
          gh release upload "${{ needs.draft.outputs.tag }}" dist/*.apk --clobber

  publish:
    needs: [draft, build, android]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.draft.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
